name: Source checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  synthetic-tests:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install 'Pillow>=12.3.0,<14'
      - run: python scripts/check_public_tree.py
      - run: python -m unittest discover -s work -p 'test_*.py'
      - name: Frontend regression tests
        run: for test in work/test_*.cjs; do node "$test" || exit 1; done
      - name: Compile PhotoKit helper without opening it
        if: runner.os == 'macOS'
        run: python scripts/build_helper.py
