name: Source checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  synthetic-tests:
    timeout-minutes: 10
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '22'
      - run: python -m pip install 'Pillow>=12.3.0,<14'
      - run: python scripts/check_public_tree.py
      - run: python -u -m unittest discover -s work -p 'test_*.py' -v
      - name: Frontend regression tests
        shell: bash
        run: for test in work/test_*.cjs; do node "$test" || exit 1; done
      - name: Compile PhotoKit helper without opening it
        if: runner.os == 'macOS'
        run: python scripts/build_helper.py
